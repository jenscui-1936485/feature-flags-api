services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
      POSTGRES_DB: flags
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg://flags:flags@db:5432/flags
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-change-me
      CACHE_TTL_SECONDS: "60"
      LOG_LEVEL: INFO
      # Entrypoint runs `alembic upgrade head`; skip a second migrate in-app.
      RUN_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
