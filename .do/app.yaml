name: feature-flags-api
region: nyc
services:
  - name: api
    github:
      repo: jenscui-1936485/feature-flags-api
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    # Request-based autoscaling works on shared CPU plans (basic-*).
    # Do not set instance_count when autoscaling is enabled.
    instance_size_slug: basic-xs
    autoscaling:
      min_instance_count: 2
      max_instance_count: 5
      metrics:
        requests_per_second:
          per_instance: 50
    health_check:
      http_path: /ready
    envs:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      # Bind to attached managed DB components (trusted sources wired by App Platform).
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${flags-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${flags-cache.DATABASE_URL}
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_AT_DEPLOY
databases:
  # Use the already-provisioned clusters (flags-pg / flags-redis Valkey).
  - name: flags-db
    engine: PG
    version: "16"
    production: true
    cluster_name: flags-pg
  - name: flags-cache
    engine: REDIS
    production: true
    cluster_name: flags-redis
